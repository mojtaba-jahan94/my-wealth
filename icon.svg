<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a"/>
      <stop offset="50%" stop-color="#18133b"/>
      <stop offset="100%" stop-color="#0e172e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="12 16" opacity="0.6"/>

  <!-- Center Shield / Coin -->
  <circle cx="256" cy="256" r="120" fill="#130f30" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>

  <!-- Stylized Vault / Trending Diamond Symbol -->
  <path d="M256 168 L324 236 L256 304 L188 236 Z" fill="url(#gold)"/>
  <path d="M256 220 L304 268 L256 316 L208 268 Z" fill="none" stroke="#fff" stroke-width="5" opacity="0.7"/>

  <!-- Spark Line -->
  <path d="M160 330 Q 210 310, 240 280 T 320 220 T 360 190" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="360" cy="190" r="10" fill="#10b981" filter="url(#glow)"/>

  <!-- Lettering 'MW' minimal -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#f5c842" letter-spacing="4">MY WEALTH</text>
</svg>
